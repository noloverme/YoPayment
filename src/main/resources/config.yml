# ╔═══════════════════════════════════════╗
# ║          YoPayment — config.yml       ║
# ╚═══════════════════════════════════════╝

yookassa:
  # Идентификатор магазина (shopId) из личного кабинета ЮKassa
  # Рекомендуется: используй переменную окружения YOOKASSA_SHOP_ID
  shop-id: "000000"

  # Секретный ключ из личного кабинета ЮKassa
  # Рекомендуется: используй переменную окружения YOOKASSA_SECRET_KEY
  secret-key: "test_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"

  # URL, на который пользователь вернётся после оплаты
  return-url: "https://pay.noloverme.xyz/"

# ╔════════════════════════════════════════════════════════════╗
# ║           Интервалы и таймауты проверки                   ║
# ╚════════════════════════════════════════════════════════════╝

# Интервал проверки статуса платежей в секундах
# Рекомендуется: 5-10 секунд
check-interval: 5

# Время жизни отслеживаемого платежа в минутах
# Если за это время платёж не перешёл в succeeded/canceled — плагин перестаёт его отслеживать
payment-timeout: 10

# Режим тихого логирования
# true  - логировать только ошибки
# false - логировать все (включая информационные сообщения)
silent-mode: true

# ╔════════════════════════════════════════════════════════════╗
# ║            Чеки по 54-ФЗ (Фискализация ЮKassa)            ║
# ╚════════════════════════════════════════════════════════════╝

receipt:
  # Включить отправку чека (обязательно для самозанятых/ИП/ООО с онлайн-кассой)
  enabled: false

  # Email по умолчанию для отправки чека покупателю
  default-email: "donate@example.com"

  # Код системы налогообложения (1-6, 0 - не передавать):
  # 1 - Общая (ОСН)
  # 2 - УСН доходы
  # 3 - УСН доходы минус расходы
  # 4 - ЕНВД
  # 5 - Единый сельскохозяйственный налог
  # 6 - Патентная система (ПСН)
  tax-system-code: 0

  # Ставка НДС (vat_code):
  # 1 - Без НДС
  # 2 - 0%
  # 3 - 10%
  # 4 - 20%
  # 5 - 10/110
  # 6 - 20/120
  vat-code: 1

# ╔════════════════════════════════════════════════════════════╗
# ║            Конфигурация базы данных                       ║
# ╚════════════════════════════════════════════════════════════╝

database:
  # Тип базы данных: h2, mysql, postgresql
  # h2         - встроенная база (рекомендуется для одиночных серверов)
  # mysql      - для связок серверов (BungeeCord/Velocity)
  # postgresql - альтернатива MySQL
  type: h2

  h2:
    # Имя файла БД (без расширения), хранится в папке плагина
    file: "yopayment"

  mysql:
    host: "localhost"
    port: 3306
    database: "yopayment"
    username: "root"
    password: ""
    # Использовать SSL-соединение (false для локальных MySQL без сертификатов)
    ssl: false
    pool-size: 10

  postgresql:
    host: "localhost"
    port: 5432
    database: "yopayment"
    username: "postgres"
    password: ""
    pool-size: 10

# ╔══════════════════════════════════════════════════════════╗
# ║   PlaceholderAPI Интеграция                             ║
# ╚══════════════════════════════════════════════════════════╝

# ТРЕБУЕТСЯ: PlaceholderAPI плагин на сервере
# Доступные плейсхолдеры (работают моментально из кэша памяти без фризов):
#
# %YoPayment_Link%
#   Показывает последнюю рабочую ссылку для оплаты игрока (или "N/A")
#
# %YoPayment_Custom:<format>%
#   Настраиваемый вывод информации о последнем платеже.
#   Переменные: {display_name}, {item}, {price}, {description}, {link}, {status}, {created_at}
#   Пример: %YoPayment_Custom:&#00bfffТовар: {display_name} | Статус: {status}%
